<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 全站统一组件：样式 -->
<link rel="stylesheet" href="https://game.leleleling.site/common.css">
<!-- 强制标记为游戏页，让公告弹窗 15 秒自动消失 -->
<script>
  window.forceGamePage = true;
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VScode太空射击游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-rocket"></i> VScode太空射击游戏</h1>
            <p class="subtitle">纯HTML/CSS/JavaScript制作 - 无需任何插件！</p>
        </header>
        
        <div class="game-container">
            <div class="game-info">
                <div class="score-board">
                    <div class="score-item">
                        <span class="label">分数</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">生命值</span>
                        <span id="lives" class="value">3</span>
                    </div>
                    <div class="score-item">
                        <span class="label">等级</span>
                        <span id="level" class="value">1</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="startBtn" class="btn"><i class="fas fa-play"></i> 开始游戏</button>
                    <button id="pauseBtn" class="btn"><i class="fas fa-pause"></i> 暂停</button>
                    <button id="resetBtn" class="btn"><i class="fas fa-redo"></i> 重置</button>
                </div>
            </div>
            
            <div class="game-area">
                <canvas id="gameCanvas" width="800" height="500"></canvas>
                <div class="instructions">
                    <h3><i class="fas fa-gamepad"></i> 操作说明：</h3>
                    <ul>
                        <li><i class="fas fa-arrow-left"></i> <i class="fas fa-arrow-right"></i> 左右箭头：移动飞船</li>
                        <li><i class="fas fa-space-shuttle"></i> 空格键：发射激光</li>
                        <li><i class="fas fa-bolt"></i> 躲避陨石，消灭敌人！</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="features">
            <h2><i class="fas fa-star"></i> 游戏特色</h2>
            <div class="features-grid">
                <div class="feature">
                    <i class="fas fa-meteor"></i>
                    <h3>动态陨石</h3>
                    <p>随机生成的陨石群，每关难度增加</p>
                </div>
                <div class="feature">
                    <i class="fas fa-bullseye"></i>
                    <h3>精准射击</h3>
                    <p>激光武器，消灭敌人获得积分</p>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <h3>分数系统</h3>
                    <p>实时计分，挑战最高记录</p>
                </div>
                <div class="feature">
                    <i class="fas fa-tachometer-alt"></i>
                    <h3>速度变化</h3>
                    <p>随着等级提升，游戏速度加快</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>使用纯VScode制作 | 无任何扩展 | 纯HTML/CSS/JavaScript</p>
            <p class="vscode-badge">
                <i class="fas fa-code"></i> 
                100% VScode原生开发
            </p>
        </footer>
    </div>
    
    <script src="game.js"></script>
<!-- 全站统一组件：脚本 -->
<script src="https://game.leleleling.site/common.js" defer></script>
<script async src="https://tally.so/widgets/embed.js"></script>
</body>

</html>
