<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <script>
        (function() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var urlLang = urlParams.get('lang');
                var storedLang = localStorage.getItem('lelele_lang');
                var lang;
                if (urlLang === 'en' || urlLang === 'zh') lang = urlLang;
                else if (storedLang === 'en' || storedLang === 'zh') lang = storedLang;
                else {
                    var navLang = (navigator.language || navigator.userLanguage || 'zh').toLowerCase();
                    if (navLang.indexOf('zh') === 0) lang = 'zh';
                    else if (navLang.indexOf('en') === 0) lang = 'en';
                    else lang = 'zh';
                }
                document.documentElement.setAttribute('data-lang', lang);
                document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>加载中... · 了了了游</title>

    <!-- 【新增：Edgemetry 统计代码】 -->
    <script defer src="https://analytics.leleleling.site/em.js" data-domain="game.leleleling.site"></script>

    <style>
        .zh-text, .en-text { display: none; }
        html[data-lang="zh"] .zh-text { display: block; }
        html[data-lang="zh"] .zh-inline { display: inline; }
        html[data-lang="en"] .en-text { display: block; }
        html[data-lang="en"] .en-inline { display: inline; }
        html[data-lang="zh"] .en-text, html[data-lang="zh"] .en-inline { display: none; }
        html[data-lang="en"] .zh-text, html[data-lang="en"] .zh-inline { display: none; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f0f4f9 0%, #e8ecf5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(79, 70, 229, 0.08);
            border-radius: 30px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(79, 70, 229, 0.15); }
        .site-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .site-title img { height: 24px; }

        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 30px auto 50px;
            padding: 0 20px;
            flex: 1;
        }

        .game-detail-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .banner-area {
            width: 100%;
            height: 320px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%);
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .banner-area:hover { filter: brightness(0.95); }
        .banner-area.no-image { height: 160px; cursor: default; }
        .banner-icon { font-size: 6rem; line-height: 1; text-shadow: 0 10px 20px rgba(0,0,0,0.1); pointer-events: none; }

        .content-area { padding: 40px; }

        .header-info {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .title-group { flex: 1; min-width: 250px; }
        .game-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        .meta-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #475569;
        }
        .tag.age { background: rgba(16, 185, 129, 0.1); color: #059669; }
        .tag.version { background: rgba(79, 70, 229, 0.1); color: #4f46e5; }

        .action-buttons { display: flex; gap: 12px; align-items: center; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 32px; border-radius: 30px; font-size: 1.05rem; font-weight: 700;
            border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; font-family: inherit;
        }
        .btn-play { background: #4f46e5; color: #fff; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); }
        .btn-play:hover { background: #4338ca; transform: translateY(-2px); box-shadow: 0 12px 24px rgba(79, 70, 229, 0.4); }
        
        .btn-fav { background: #f1f5f9; color: #1e293b; padding: 14px 20px; box-shadow: none; }
        .btn-fav:hover { background: #e2e8f0; }
        .btn-fav.active { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .btn-fav.active:hover { background: #fde68a; }

        .author-bar {
            display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #64748b;
            margin-top: 16px; padding-top: 16px; border-top: 1px dashed #e2e8f0;
        }
        .author-bar strong { color: #1e293b; }

        .section-title {
            font-size: 1.2rem; font-weight: 700; color: #0f172a;
            margin: 30px 0 16px; padding-left: 10px; border-left: 4px solid #4f46e5;
        }
        
        .game-description {
            font-size: 1rem; line-height: 1.8; color: #334155; white-space: pre-wrap;
            background: #f8fafc; padding: 24px; border-radius: 16px; border: 1px solid #f1f5f9;
        }

        /* 截图展示区 */
        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .screenshot-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e2e8f0;
        }
        .screenshot-img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #e2e8f0; margin-left: 10px; }
        .timeline-item { position: relative; margin-bottom: 24px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-item::before {
            content: ''; position: absolute; left: -25px; top: 4px; width: 12px; height: 12px;
            border-radius: 50%; background: #4f46e5; border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        .timeline-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
        .timeline-version { font-weight: 700; color: #0f172a; }
        .timeline-date { font-size: 0.85rem; color: #94a3b8; }
        .timeline-content { font-size: 0.95rem; color: #475569; line-height: 1.6; white-space: pre-wrap; }

        .loading-state, .error-state { text-align: center; padding: 60px 20px; color: #64748b; font-size: 1.1rem; display: none; }
        .error-state .btn { margin-top: 20px; }

        /* 全屏图片预览遮罩 */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img {
            max-width: 90%; max-height: 90%; border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain;
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        .lightbox.active img { transform: scale(1); }
        .lightbox-close {
            position: absolute; top: 20px; right: 30px;
            font-size: 3rem; color: rgba(255,255,255,0.7); cursor: pointer;
            line-height: 1; transition: color 0.2s;
        }
        .lightbox-close:hover { color: #fff; }

        @media (max-width: 768px) {
            .content-area { padding: 24px; }
            .game-title { font-size: 1.8rem; }
            .header-info { flex-direction: column; }
            .action-buttons { width: 100%; flex-direction: column-reverse; }
            .btn { width: 100%; }
            .btn-fav { padding: 14px; }
            .banner-area { height: 200px; }
            .banner-area.no-image { height: 120px; }
            .banner-icon { font-size: 4rem; }
            .top-bar { padding: 10px 16px; }
            .screenshots-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn" id="backBtn">
            ← <span class="zh-inline">返回首页</span><span class="en-inline">Back to Home</span>
        </a>
        <div class="site-title" onclick="window.location.href='index.html'">
            <img src="lelelegame.svg" alt="Logo" onerror="this.style.display='none'">
            <span class="zh-inline">了了了游</span><span class="en-inline">lelele Game</span>
        </div>
    </div>

    <div class="main-container">
        
        <div class="loading-state" id="loadingState" style="display:block;">
            <div style="font-size: 2rem; margin-bottom: 10px;">🔄</div>
            <span class="zh-inline">正在加载游戏详情...</span><span class="en-inline">Loading game details...</span>
        </div>

        <div class="error-state" id="errorState">
            <div style="font-size: 3rem; margin-bottom: 10px;">😢</div>
            <div id="errorMsg"></div>
            <a href="index.html" class="btn btn-play" id="errorBackBtn">
                <span class="zh-inline">返回首页</span><span class="en-inline">Back to Home</span>
            </a>
        </div>

        <div class="game-detail-card" id="gameCard">
            <!-- 顶部背景图，点击可放大 -->
            <div class="banner-area" id="bannerArea" onclick="openLightbox(this.style.backgroundImage.slice(5, -2))">
                <div class="banner-icon" id="bannerIcon">🎮</div>
            </div>

            <div class="content-area">
                <div class="header-info">
                    <div class="title-group">
                        <h1 class="game-title" id="gameTitle"></h1>
                        <div class="meta-tags" id="metaTags"></div>
                        <div class="author-bar" id="authorBar"></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-fav" id="favBtn" onclick="toggleFav()"></button>
                        <button class="btn btn-play" id="playBtn" onclick="playGame()">
                            <span class="zh-inline">🎮 开始游戏</span><span class="en-inline">🎮 Play Game</span>
                        </button>
                    </div>
                </div>

                <div class="section-title">
                    <span class="zh-inline">📖 游戏简介</span><span class="en-inline">📖 Description</span>
                </div>
                <div class="game-description" id="gameDesc"></div>

                <!-- 游戏截图展示区 (动态渲染) -->
                <div id="screenshotsContainer" style="display:none;">
                    <div class="section-title">
                        <span class="zh-inline">🖼️ 游戏截图</span><span class="en-inline">🖼️ Screenshots</span>
                    </div>
                    <div class="screenshots-grid" id="screenshotsGrid"></div>
                </div>

                <div id="updateLogContainer" style="display:none;">
                    <div class="section-title">
                        <span class="zh-inline">📝 更新日志</span><span class="en-inline">📝 Update Log</span>
                    </div>
                    <div class="timeline" id="timeline"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- 全屏图片预览层 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="Preview" onclick="event.stopPropagation()">
    </div>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let currentGameId = null;
        let currentGameData = null;
        const currentLang = document.documentElement.getAttribute('data-lang') || 'zh';
        const isEn = currentLang === 'en';
        const textSuffix = isEn ? '?lang=en' : '';

        document.getElementById('backBtn').href = 'index.html' + textSuffix;
        document.getElementById('errorBackBtn').href = 'index.html' + textSuffix;

        // ==================== 图片预览 (Lightbox) 逻辑 ====================
        window.openLightbox = function(imgSrc) {
            if (!imgSrc || imgSrc === 'none' || imgSrc === 'url("")') return;
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightbox').classList.add('active');
        };

        window.closeLightbox = function(event) {
            if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
                document.getElementById('lightbox').classList.remove('active');
                setTimeout(() => { document.getElementById('lightboxImg').src = ''; }, 300);
            }
        };

        // ==================== 收藏与游玩逻辑 ====================
        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('lelele_favs') || '[]'); } catch (e) { return []; }
        }
        function isFav(id) { return getFavorites().includes(String(id)); }

        function updateFavBtn() {
            const btn = document.getElementById('favBtn');
            if (isFav(currentGameId)) {
                btn.innerHTML = '<span class="zh-inline">🌟 已收藏</span><span class="en-inline">🌟 Favorited</span>';
                btn.classList.add('active');
            } else {
                btn.innerHTML = '<span class="zh-inline">⭐ 收藏</span><span class="en-inline">⭐ Favorite</span>';
                btn.classList.remove('active');
            }
        }

        window.toggleFav = function() {
            if (!currentGameId) return;
            let favs = getFavorites();
            const idStr = String(currentGameId);
            if (favs.includes(idStr)) favs = favs.filter(f => f !== idStr);
            else favs.push(idStr);
            try { localStorage.setItem('lelele_favs', JSON.stringify(favs)); } catch (e) {}
            updateFavBtn();
        };

                // 【修改】将游戏名拼接到事件名中，以便在后台直接查看每个游戏的点击量
        window.playGame = function() {
            if (!currentGameData || !currentGameData.url) {
                alert(isEn ? 'No playable link available.' : '该游戏暂无可用链接。');
                return;
            }

            if (typeof edgemetry !== 'undefined') {
                const gameName = currentGameData.name_zh || currentGameData.name;
                edgemetry('play-game_' + gameName);
            }

            window.open(currentGameData.url, '_blank', 'noopener,noreferrer');
        };

            

        // ==================== 页面渲染 ====================
        function renderGamePage(game) {
            const gameName = isEn ? (game.name_en || game.name_zh || game.name) : (game.name_zh || game.name_en || game.name);
            document.title = `${gameName || (isEn ? 'Unknown' : '未知游戏')} · 了了了游`;

            const bannerArea = document.getElementById('bannerArea');
            const bannerIcon = document.getElementById('bannerIcon');
            if (game.banner) {
                bannerArea.style.backgroundImage = `url('${escapeHtml(game.banner)}')`;
                bannerArea.classList.remove('no-image');
                bannerIcon.style.display = 'none';
                bannerArea.setAttribute('title', isEn ? 'Click to enlarge' : '点击查看大图');
            } else {
                bannerArea.style.backgroundImage = 'linear-gradient(135deg, rgba(79,70,229,0.1) 0%, rgba(124,58,237,0.1) 100%)';
                bannerArea.classList.add('no-image');
                bannerArea.onclick = null;
                bannerIcon.style.display = 'block';
                bannerIcon.textContent = game.icon || '🎮';
            }

            document.getElementById('gameTitle').textContent = gameName;
            
            const gameCat = isEn ? (game.category_en || game.category_zh || game.category) : (game.category_zh || game.category_en || game.category);
            const gameAge = isEn ? (game.ageRating_en || game.ageRating_zh || game.ageRating) : (game.ageRating_zh || game.ageRating_en || game.ageRating);
            
            let tagsHtml = '';
            if (gameCat) tagsHtml += `<span class="tag">${escapeHtml(gameCat)}</span>`;
            if (gameAge) tagsHtml += `<span class="tag age">${escapeHtml(gameAge)}</span>`;
            if (game.version) tagsHtml += `<span class="tag version">${escapeHtml(game.version)}</span>`;
            document.getElementById('metaTags').innerHTML = tagsHtml;

            const authorBar = document.getElementById('authorBar');
            if (game.author) {
                const authorLabel = isEn ? 'Developer' : '开发者';
                authorBar.innerHTML = `${authorLabel}: <strong>${escapeHtml(game.author)}</strong>`;
            } else {
                authorBar.style.display = 'none';
            }

            let descText = isEn ? (game.description_en || game.description_zh || game.description) : (game.description_zh || game.description_en || game.description);
            if (!descText) {
                descText = isEn ? 'No description provided yet.' : '这个游戏很神秘，作者还没有写详细简介。';
            }
            document.getElementById('gameDesc').textContent = descText;

            if (game.screenshots && Array.isArray(game.screenshots) && game.screenshots.length > 0) {
                document.getElementById('screenshotsContainer').style.display = 'block';
                const grid = document.getElementById('screenshotsGrid');
                grid.innerHTML = game.screenshots.map(src => `
                    <img class="screenshot-img" src="${escapeHtml(src)}" alt="Screenshot" onclick="openLightbox('${escapeHtml(src)}')">
                `).join('');
            }

            const logs = isEn ? (game.updateLog_en || game.updateLog_zh || game.updateLog) : (game.updateLog_zh || game.updateLog_en || game.updateLog);
            if (logs && Array.isArray(logs) && logs.length > 0) {
                document.getElementById('updateLogContainer').style.display = 'block';
                const timeline = document.getElementById('timeline');
                timeline.innerHTML = logs.map(log => `
                    <div class="timeline-item">
                        <div class="timeline-header">
                            <span class="timeline-version">${escapeHtml(log.version || (isEn ? 'Update' : '更新'))}</span>
                            <span class="timeline-date">${escapeHtml(log.date || '')}</span>
                        </div>
                        <div class="timeline-content">${escapeHtml(log.content || '')}</div>
                    </div>
                `).join('');
            }

            updateFavBtn();
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('gameCard').style.display = 'block';
        }

        // ==================== 数据加载 ====================
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentGameId = urlParams.get('id');

            if (!currentGameId) {
                showError(isEn ? 'Missing game ID parameter.' : '缺少游戏 ID 参数，无法加载。');
                return;
            }

            try {
                const detailRes = await fetch(`/game/data/${currentGameId}.json`);
                
                if (detailRes.ok) {
                    currentGameData = await detailRes.json();
                    renderGamePage(currentGameData);
                    return;
                }
                
                console.warn(`未找到详细数据，尝试从主列表加载 ID: ${currentGameId}`);
                const baseRes = await fetch('lelegame_data.json');
                if (baseRes.ok) {
                    const baseData = await baseRes.json();
                    const baseGame = baseData.find(g => String(g.id) === String(currentGameId));
                    
                    if (baseGame) {
                        currentGameData = {
                            id: baseGame.id, icon: baseGame.icon,
                            name_zh: baseGame.name_zh || baseGame.name,
                            name_en: baseGame.name_en || baseGame.name,
                            category_zh: baseGame.category_zh || baseGame.category,
                            category_en: baseGame.category_en || baseGame.category,
                            ageRating_zh: baseGame.ageRating_zh || baseGame.ageRating,
                            ageRating_en: baseGame.ageRating_en || baseGame.ageRating,
                            url: baseGame.url, 
                            version: baseGame.version || (isEn ? 'Unknown' : '未知版本'),
                            description_zh: '暂无详细简介，作者可能正在努力编写中。你可以直接点击上方按钮开始游戏体验。',
                            description_en: 'No detailed description yet. Click Play to try.'
                        };
                        renderGamePage(currentGameData);
                        return;
                    }
                }

                showError(isEn ? 'Game not found or removed.' : '该游戏不存在或已被下架。');
            } catch (e) {
                console.error('加载失败:', e);
                showError(isEn ? 'Network error, please try again later.' : '网络或数据加载失败，请稍后重试。');
            }
        }

        function showError(msg) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('gameCard').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMsg').textContent = msg;
        }

        init();
    </script>
</body>
</html>
