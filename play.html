<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lelele Game · Player</title>
<meta name="robots" content="noindex,nofollow">
<script src="/legal_generic.js" defer></script>
<style>
  :root { --bar:#1e293b; --bar2:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --btn:#334155; --btn-h:#475569; --accent:#4f46e5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    /* 背景只在最底层；游戏 iframe 独立白底覆盖其上，不会被装饰遮挡 */
    background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 55%,#ede9fe 100%);
    color:var(--fg); overflow:hidden;
  }
  html.dark body { background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%); }
  .zh-inline,.en-inline { display:none; }
  html[data-lang="zh"] .zh-inline { display:inline; }
  html[data-lang="en"] .en-inline { display:inline; }

  #playRoot { position:fixed; inset:0; display:flex; flex-direction:column; }
  .pbar { display:flex; align-items:center; gap:8px; flex-shrink:0; padding:9px 12px; background:var(--bar); }
  .dots { display:flex; gap:7px; flex-shrink:0; }
  .dots i { display:block; width:12px; height:12px; border-radius:50%; }
  .dots .r { background:#ff5f56; } .dots .y { background:#ffbd2e; } .dots .g { background:#27c93f; }
  .url {
    flex:1; min-width:0; background:var(--bar2); border:1px solid #334155; border-radius:999px;
    padding:6px 12px; font-size:12px; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  button {
    background:var(--btn); color:var(--fg); border:0; border-radius:10px; padding:7px 11px;
    font:600 12px/1 inherit; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  button:hover { background:var(--btn-h); }
  button.langbtn { background:var(--accent); }
  /* 外链兜底条：高对比大字号，避免“看不出来能新标签打开” */
  .extbar {
    display:none; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; flex-shrink:0;
    padding:12px 16px; background:#b45309; color:#fff; font-size:15px; font-weight:700;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .extbar a {
    color:#fff; font-weight:800; font-size:15px; text-decoration:underline;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.5);
    border-radius:8px; padding:4px 12px;
  }
  .extbar a:hover { background:rgba(255,255,255,.32); }
  .stage { flex:1; min-height:0; position:relative; background:#fff; }
  /* 不设 sandbox：同源游戏的 localStorage 存档必须可用 */
  #gameFrame { width:100%; height:100%; border:0; display:block; background:#fff; }
  /* 沉浸全屏：iframe 自己全屏，外壳（顶栏/底栏/地址栏）完全消失，只留游戏画面 */
  #gameFrame:fullscreen, #gameFrame:-webkit-full-screen { width:100vw; height:100vh; }
  .pfoot { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; flex-shrink:0; padding:8px 10px; background:var(--bar); }
  button.filebtn { background:#0f766e; font-size:11px; padding:7px 10px; }
  button.filebtn:hover { background:#115e59; }
  /* 站点页脚栏（非全屏时常驻，全屏随外壳一起消失） */
  .sitefoot {
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    flex-shrink:0; padding:7px 12px; background:#0f172a; color:#94a3b8; font-size:11px;
  }
  .sitefoot a { color:#a5b4fc; text-decoration:none; }
  .sitefoot a:hover { color:#c7d2fe; text-decoration:underline; }
  /* 三文件弹窗 */
  .file-modal { position:fixed; inset:0; z-index:3000; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(2,6,23,.78); }
  .file-modal.active { display:flex; }
  .file-box { width:min(860px,100%); max-height:86vh; display:flex; flex-direction:column; background:#1e293b; color:#e2e8f0; border:1px solid #475569; border-radius:16px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .file-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; background:#0f172a; border-bottom:1px solid #334155; }
  .file-head strong { font-size:14px; }
  .file-head button { background:#334155; padding:6px 12px; }
  .file-body { margin:0; padding:18px; overflow:auto; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; color:#e2e8f0; }
  .file-tip { padding:8px 18px; background:rgba(79,70,229,.14); color:#c7d2fe; font-size:12px; }
  /* 协议弹窗正文（沿用 game.html 的 legal-modal 观感） */
  .file-body.legal { font:14px/1.85 inherit; white-space:normal; }
  .file-body.legal h4 { font-size:15px; margin:14px 0 4px; color:#fff; }
  .file-body.legal p { margin:6px 0; }
  .legal-sub, .legal-note { font-size:12px; color:#a5b4fc; padding-bottom:8px; border-bottom:1px solid #334155; margin-bottom:8px; }
  .legal-note { color:#cbd5e1; border:0; padding:8px 10px; background:rgba(148,163,184,.1); border-radius:8px; }
  .legal-foot { margin-top:14px; padding-top:10px; border-top:1px dashed #475569; font-size:12px; }
  .legal-foot a { color:#a5b4fc; }
  .msg {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#fff; color:#64748b; font-size:14px; text-align:center; padding:20px;
  }
  @media (max-width:640px){
    .pbar { gap:5px; padding:7px 8px; }
    button { padding:6px 8px; font-size:11px; }
    .dots i { width:9px; height:9px; }
    .url { font-size:11px; }
  }
</style>
</head>
<body>
<div id="playRoot">
  <div class="pbar">
    <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="url" id="urlBar">about:blank</div>
    <button type="button" class="langbtn" id="langBtn" title="Switch language / 切换语言"><span class="zh-inline">🌐 EN</span><span class="en-inline">🌐 中文</span></button>
    <button type="button" id="reloadBtn">↻ <span class="zh-inline">重载</span><span class="en-inline">Reload</span></button>
    <button type="button" id="fullBtn">⛶ <span class="zh-inline">全屏</span><span class="en-inline">Fullscreen</span></button>
    <button type="button" id="closeBtn">✕ <span class="zh-inline">关闭</span><span class="en-inline">Close</span></button>
  </div>
  <div class="extbar" id="extBar">
    <span>⚠️ <span class="zh-inline">该游戏来自外部站点，可能无法在本页正常显示。请点这里</span><span class="en-inline">This game is hosted externally and may not display here. Please</span></span>
    <a id="extLink" href="#" target="_blank" rel="noopener noreferrer"><span class="zh-inline">在新标签页打开 ↗</span><span class="en-inline">open in a new tab ↗</span></a>
  </div>
  <div class="stage">
    <iframe id="gameFrame" title="Game" allow="autoplay; fullscreen; gamepad; microphone; camera; clipboard-write; accelerometer; gyroscope" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="msg" id="msgBox"><span class="zh-inline">正在读取游戏信息…</span><span class="en-inline">Loading game…</span></div>
  </div>
  <div class="pfoot">
    <button type="button" id="footReload">↻ <span class="zh-inline">重载</span><span class="en-inline">Reload</span></button>
    <button type="button" id="footHome">🏠 <span class="zh-inline">重试</span><span class="en-inline">Retry</span></button>
    <button type="button" id="footFull">⛶ <span class="zh-inline">全屏</span><span class="en-inline">Fullscreen</span></button>
    <button type="button" id="footClose">✕ <span class="zh-inline">关闭</span><span class="en-inline">Close</span></button>
    <button type="button" class="filebtn" id="legalEulaBtn">📄 <span class="zh-inline">用户协议</span><span class="en-inline">EULA</span></button>
    <button type="button" class="filebtn" id="legalPrivacyBtn">🔒 <span class="zh-inline">隐私政策</span><span class="en-inline">Privacy Policy</span></button>
    <button type="button" class="filebtn" id="legalTermsBtn">📜 <span class="zh-inline">服务条款</span><span class="en-inline">Terms of Service</span></button>
  </div>
  <div class="sitefoot">
    <a href="/index.html"><span class="zh-inline">返回首页</span><span class="en-inline">Back to Home</span></a>
    <span>·</span>
    <a href="/game_rules.html"><span class="zh-inline">游戏守则</span><span class="en-inline">Game Rules</span></a>
    <span>·</span>
    <a href="/user_agreement.html"><span class="zh-inline">用户协议</span><span class="en-inline">User Agreement</span></a>
    <span>·</span>
    <a href="/privacy.html"><span class="zh-inline">隐私政策</span><span class="en-inline">Privacy</span></a>
    <span>·</span>
    <a href="/terms.html"><span class="zh-inline">服务条款</span><span class="en-inline">Terms</span></a>
    <span>·</span>
    <a href="/copyright.html"><span class="zh-inline">版权投诉</span><span class="en-inline">Copyright</span></a>
    <span>· © 2026 <span class="zh-inline">了了了岭工作室</span><span class="en-inline">Leleleling Studio</span></span>
  </div>
</div>

<div class="file-modal" id="fileModal" role="dialog" aria-modal="true" aria-label="Game files / 游戏文件">
  <div class="file-box">
    <div class="file-head"><strong id="fileTitle">—</strong><button type="button" id="fileClose">✕ <span class="zh-inline">关闭</span><span class="en-inline">Close</span></button></div>
    <div class="file-tip" id="fileTip"></div>
    <pre class="file-body" id="fileBody">…</pre>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(window.location.search);
  var gameId = params.get('id') || '';
  var game = null, targetUrl = '', sameOrigin = false, legalUrls = {};

  function stored(key, fallback) {
    try { var v = localStorage.getItem(key); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function isEn() { return document.documentElement.getAttribute('data-lang') === 'en'; }

  var initialLang = params.get('lang');
  if (initialLang !== 'zh' && initialLang !== 'en') initialLang = stored('lelele_lang', '');
  if (initialLang !== 'zh' && initialLang !== 'en') initialLang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';

  function applyLang(lang) {
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
    save('lelele_lang', lang);
    // 同步语言给游戏子页里的 common.js（若它加载了）
    try {
      var f = $('gameFrame');
      if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'lelele:setLang', lang: lang }, '*');
    } catch (e) {}
  }
  applyLang(initialLang);

  $('langBtn').addEventListener('click', function () { applyLang(isEn() ? 'zh' : 'en'); });

  function showMsg(text) { var b = $('msgBox'); b.textContent = text; b.style.display = 'flex'; }

  function fetchJSON(url, ms) {
    return new Promise(function (resolve, reject) {
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, ms || 8000);
      fetch(url, ctrl ? { signal: ctrl.signal } : {})
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { clearTimeout(timer); resolve(d); })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  // 同源游戏子页加 embed=1 + lang：common.js 识别后跳过页脚 / 节日装饰 / 公告弹窗
  function frameSrc(url) {
    if (!sameOrigin) return url;
    try {
      var u = new URL(url, window.location.href);
      u.searchParams.set('embed', '1');
      u.searchParams.set('lang', isEn() ? 'en' : 'zh');
      return u.pathname + u.search + u.hash;
    } catch (e) { return url; }
  }

  function loadGame() {
    if (!gameId) { showMsg(isEn() ? 'Missing ?id= parameter.' : '缺少 ?id= 参数。'); return; }
    fetchJSON('/lelegame_data.json?t=' + Date.now())
      .then(function (list) {
        game = list.find(function (g) { return String(g.id) === String(gameId); });
        if (!game) throw new Error('Game id ' + gameId + ' not found');
        if (!game.url) throw new Error('No playable URL');
        targetUrl = game.url;
        $('urlBar').textContent = targetUrl;
        $('extLink').href = targetUrl;
        try { sameOrigin = new URL(targetUrl, window.location.href).origin === window.location.origin; }
        catch (e) { sameOrigin = false; }
        // 外链（跨源）站点可能禁止内嵌，明确给出链接兜底
        $('extBar').style.display = sameOrigin ? 'none' : 'flex';
        $('msgBox').style.display = 'none';
        $('gameFrame').src = frameSrc(targetUrl);
        // 协议直链（与 game.html 同契约）：读 game/data/<id>.json 的 legal_urls
        fetchJSON('/game/data/' + encodeURIComponent(gameId) + '.json?t=' + Date.now())
          .then(function (d) { legalUrls = (d && d.legal_urls && typeof d.legal_urls === 'object') ? d.legal_urls : {}; })
          .catch(function () { legalUrls = {}; });
      })
      .catch(function (e) { showMsg((isEn() ? 'Failed to load game: ' : '游戏加载失败：') + e.message); });
  }

  function reload() { if (targetUrl) $('gameFrame').src = frameSrc(targetUrl); }
  $('reloadBtn').addEventListener('click', reload);
  $('footReload').addEventListener('click', reload);
  $('footHome').addEventListener('click', reload);

  function closePlay() {
    try {
      if (document.referrer && history.length > 1) { history.back(); return; }
    } catch (e) {}
    window.location.href = '/game.html?id=' + encodeURIComponent(gameId);
  }
  $('closeBtn').addEventListener('click', closePlay);
  $('footClose').addEventListener('click', closePlay);

  // 全屏：只让 iframe 全屏（外壳顶栏/底栏/地址栏全部消失），不是整窗套壳
  function exitFull() {
    var d = document;
    var exit = d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen;
    if (exit) { try { var p = exit.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function iframeFull() {
    var f = $('gameFrame');
    var req = f.requestFullscreen || f.webkitRequestFullscreen || f.mozRequestFullScreen;
    if (req) { try { var p = req.call(f); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function toggleFull() {
    var d = document;
    var inFull = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement;
    if (inFull) { exitFull(); return; }
    // 外链游戏：先中英双语确认，避免用户进全屏后才发现游戏根本没正常运行
    if (!sameOrigin && targetUrl) {
      var msg = isEn()
        ? 'This game is hosted on another site and may not be embeddable. Fullscreen may not work well. Continue?'
        : '该游戏来自外部站点，可能不适合嵌入。全屏后可能玩不了或体验不好，仍要全屏吗？';
      if (!window.confirm(msg)) return;
    }
    iframeFull();
  }
  $('fullBtn').addEventListener('click', toggleFull);
  $('footFull').addEventListener('click', toggleFull);
  function updateFullLabel() {
    var inFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    ['fullBtn', 'footFull'].forEach(function (id) {
      var b = $(id); if (!b) return;
      var zh = b.querySelector('.zh-inline'), en = b.querySelector('.en-inline');
      if (zh) zh.textContent = inFull ? '退出全屏' : '全屏';
      if (en) en.textContent = inFull ? 'Exit Full' : 'Fullscreen';
    });
  }
  document.addEventListener('fullscreenchange', updateFullLabel);
  document.addEventListener('webkitfullscreenchange', updateFullLabel);

  // ===== 协议三按钮（与 game.html 4.1.0 同契约）=====
  // 合法 https 直链 → 新标签打开游戏方协议；缺失/空串/非法 → 弹窗渲染 legal_generic.js 平台万能协议
  var LEGAL_KINDS = ['eula', 'privacy', 'terms'];
  var legalKind = 'eula';
  function safeLegalUrl(value) {
    if (typeof value !== 'string') return null;
    var s = value.trim();
    if (!s || /[\s\u0000-\u001f\u007f]/.test(s)) return null;
    if (!/^https:\/\/[^\/?#\s]+/i.test(s)) return null;
    try { var u = new URL(s); return (u.protocol === 'https:' && u.hostname) ? u.href : null; }
    catch (e) { return null; }
  }
  function renderLegal(kind) {
    var body = $('fileBody'), title = $('fileTitle'), tip = $('fileTip');
    var lang = isEn() ? 'en' : 'zh';
    var data = window.LELELE_GENERIC_AGREEMENTS;
    body.classList.add('legal');
    tip.textContent = '';
    if (!data || !data[lang] || !data[lang][kind]) {
      title.textContent = isEn() ? 'Agreement' : '协议';
      body.textContent = isEn()
        ? 'Unable to load the agreement at the moment. Please refresh and try again.'
        : '协议正文暂时无法载入，请刷新后重试。';
      return;
    }
    var doc = data[lang][kind];
    title.textContent = doc.title;
    body.textContent = '';
    function add(cls, text) { var d = document.createElement('div'); d.className = cls; d.textContent = text; body.appendChild(d); }
    add('legal-sub', doc.subtitle);
    add('legal-note', doc.notice);
    doc.sections.forEach(function (sec) {
      var h = document.createElement('h4'); h.textContent = sec.heading; body.appendChild(h);
      sec.paragraphs.forEach(function (text) { var p = document.createElement('p'); p.textContent = text; body.appendChild(p); });
    });
    var foot = document.createElement('div'); foot.className = 'legal-foot';
    var pageMap = { eula: 'generic_eula.html', privacy: 'generic_privacy.html', terms: 'generic_tos.html' };
    var a = document.createElement('a');
    a.href = pageMap[kind] + (isEn() ? '?lang=en' : '');
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = isEn() ? 'Open the full agreement in a new tab ↗' : '在新标签查看完整协议 ↗';
    foot.appendChild(a); body.appendChild(foot);
  }
  function openLegal(kind) {
    if (LEGAL_KINDS.indexOf(kind) < 0) return;
    var url = safeLegalUrl(legalUrls[kind]);
    if (url) {
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      if (a.parentNode) a.parentNode.removeChild(a);
      return;
    }
    legalKind = kind;
    renderLegal(kind);
    $('fileModal').classList.add('active');
  }
  function closeFile() { $('fileModal').classList.remove('active'); }
  $('legalEulaBtn').addEventListener('click', function () { openLegal('eula'); });
  $('legalPrivacyBtn').addEventListener('click', function () { openLegal('privacy'); });
  $('legalTermsBtn').addEventListener('click', function () { openLegal('terms'); });
  $('fileClose').addEventListener('click', closeFile);
  $('fileModal').addEventListener('click', function (e) { if (e.target === $('fileModal')) closeFile(); });
  // 弹窗打开时语言切换需重绘协议正文（observe 与 langChanged 双通道去重，同 game.html）
  var lastLegalRender = 0;
  function onLegalLangChange() {
    if (!$('fileModal').classList.contains('active')) return;
    var now = Date.now(); if (now - lastLegalRender < 60) return;
    lastLegalRender = now; renderLegal(legalKind);
  }
  window.addEventListener('langChanged', onLegalLangChange);
  if (window.MutationObserver) {
    new MutationObserver(onLegalLangChange).observe(document.documentElement, { attributes: true, attributeFilter: ['data-lang'] });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('fileModal').classList.contains('active')) { closeFile(); return; }
    if (!document.fullscreenElement && !document.webkitFullscreenElement) closePlay();
  });
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'lelele:langRequest') applyLang(e.data.lang === 'en' ? 'en' : 'zh');
  });

  loadGame();
})();
</script>
</body>
</html>
