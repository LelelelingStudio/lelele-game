<!doctype html>
<html lang="zh" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>了了了游 · 站内管理控制台</title>
<script src="../lsfp-adapter.js" defer></script>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --card2:#f8fafc; --primary:#4f46e5; --primary-d:#4338ca;
    --text:#1e293b; --muted:#64748b; --line:#e2e8f0; --line-d:#334155;
    --ok:#16a34a; --warn:#f59e0b; --err:#ef4444; --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f172a; --card:#162033; --card2:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--primary)}
  .topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:15px;letter-spacing:.2px}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-weight:600}
  .field{display:flex;flex-direction:column;gap:4px}
  .field-row{display:flex;flex-wrap:wrap;gap:10px}
  .grow{flex:1 1 200px}
  label{font-size:12px;color:var(--muted);font-weight:600}
  input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;width:100%}
  textarea{resize:vertical;min-height:70px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .duo .field label::after{content:""}
  .pill{font-size:11px;color:var(--muted)}
  .hint{font-size:11px;color:var(--muted);margin-top:2px}
  .warn-host{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent);padding:8px 12px;border-radius:10px;font-size:12px;display:none}
  main{max-width:1180px;margin:0 auto;padding:20px 18px 120px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:20px}
  .card{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 50%,var(--line))}
  .card.active{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
  .card.disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
  .card .ico{font-size:22px}
  .card .t{font-weight:700;margin-top:6px}
  .card .d{font-size:12px;color:var(--muted);margin-top:3px}
  .cta{font-size:11px;color:var(--primary);font-weight:600;margin-top:8px;display:inline-block}
  .work{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  @media (max-width:860px){ .work{grid-template-columns:1fr} }
  .pane{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .pane h2{margin:0 0 14px;font-size:16px}
  .groupline{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .groupline::after{content:"";flex:1;height:1px;background:var(--line)}
  .toolbar{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap}
  .tbtn{font-size:12px;padding:6px 10px;border:1px solid var(--line);background:var(--card2);border-radius:8px;cursor:pointer;color:var(--text)}
  .tbtn:hover{border-color:var(--primary);color:var(--primary)}
  .media-row,.btn-row{display:grid;gap:8px;align-items:center;margin-bottom:8px;grid-template-columns:90px 1fr 1fr 32px}
  .media-row.head,.btn-row.head{grid-template-columns:90px 1fr 1fr 32px;font-size:11px;color:var(--muted);font-weight:600}
  .rm{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
  .addrow{font-size:12px;color:var(--primary);background:none;border:1px dashed var(--line);border-radius:8px;padding:7px;width:100%;cursor:pointer}
  .addrow:hover{border-color:var(--primary)}
  .preview pre{white-space:pre-wrap;word-break:break-word;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;max-height:340px;overflow:auto}
  .files{font-size:12px;margin:0 0 10px;padding:0;list-style:none}
  .files li{padding:4px 0;border-bottom:1px dashed var(--line)}
  .files b{color:var(--ok)}
  .rfc{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card2)}
  .rfc h4{margin:0 0 8px;font-size:13px}
  .submitbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:12px 18px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .submitbar .status{margin-right:auto;font-size:12px;color:var(--muted);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  button.primary{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer}
  .toast{position:fixed;top:70px;right:18px;z-index:99;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;max-width:320px;display:none}
  .toast.err{border-color:var(--err);color:var(--err)}
  .toast.ok{border-color:var(--ok);color:var(--ok)}
  [hidden]{display:none!important}
  .placeholder-note{color:var(--muted);font-size:13px;line-height:1.7}
  .placeholder-note code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12px}
  .modebar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--muted);background:var(--card2);user-select:none}
  .seg.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .seg-hint{font-size:11px;color:var(--muted)}
  #jsonEditor{width:100%;min-height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;margin-bottom:10px}
  .rawjson{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .rawjson summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600}
  .rawjson #bodyPreview{max-height:300px}
  .v-ann,.v-notice{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .v-ann-head,.v-notice-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .v-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
  .v-badge-notice{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .v-date{font-size:11px;color:var(--muted)}
  .v-title{margin:4px 0 6px;font-size:18px}
  .v-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
  .v-content{font-size:14px;line-height:1.7}
  .v-content img{max-width:100%;border-radius:8px;margin:6px 0}
  .v-content video{max-width:100%;border-radius:8px}
  .v-game{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .v-banner-wrap{width:100%;max-height:160px;overflow:hidden;background:var(--card)}
  .v-banner{width:100%;display:block;object-fit:cover;max-height:160px}
  .v-game-main{display:flex;gap:12px;padding:14px}
  .v-icon{font-size:40px;line-height:1}
  .v-name{font-size:18px;font-weight:700}
  .v-name-en{font-size:13px;color:var(--muted);font-weight:400}
  .v-badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .v-b{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
  .v-sum{font-size:13px;color:var(--muted)}
  .v-desc{white-space:pre-wrap;font-size:13px;line-height:1.7;padding:0 14px 12px}
  .v-shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:0 14px 12px}
  .v-shot{width:100%;height:88px;object-fit:cover;border-radius:8px;background:var(--card);border:1px solid var(--line)}
  .v-url{display:inline-block;margin:0 14px 14px;color:var(--primary);font-weight:600}
  .v-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .v-btn{font-size:13px;padding:8px 14px;border-radius:10px;background:var(--primary);color:#fff;text-decoration:none}
  .v-err{color:var(--err);font-size:13px;background:color-mix(in srgb,var(--err) 12%,transparent);padding:10px;border-radius:10px}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">了了了游 · 管理控制台</span>
  <span class="badge">内部工具 · 需令牌</span>
  <div class="field grow" style="max-width:340px">
    <label>GitHub 令牌（细粒度 PAT，仅 Contents 写权限；只存本机浏览器）</label>
    <input id="pat" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off">
  </div>
  <button class="ghost" id="testBtn">测试连接</button>
  <button class="ghost" id="pullBtn">拉取最新数据</button>
  <span id="connState" class="pill"></span>
</header>

<div class="warn-host" id="hostWarn" style="display:none">⚠ 此页面已公开可访问，仅站长本人应在此输入 PAT。切勿向他人分享本地址；令牌仅保存在你本机浏览器，不会进入代码或仓库。</div>

<main>
  <section class="cards" id="cards"></section>

  <section class="work" id="work" hidden>
    <div class="pane" id="formPane">
      <h2 id="formTitle"></h2>
      <div class="modebar" id="modeBar" hidden>
        <span class="seg active" data-mode="form">✍️ 填空式</span>
        <span class="seg" data-mode="json">{} 粘贴 / 改 JSON</span>
        <span class="seg-hint" id="modeHint">也可把审核 AI 返回的 JSON 直接粘贴进来</span>
      </div>
      <textarea id="jsonEditor" hidden spellcheck="false"></textarea>
      <div id="formBody"></div>
    </div>
    <div class="pane preview">
      <h2>效果预览</h2>
      <ul class="files" id="fileList"></ul>
      <div id="visualPreview"></div>
      <details class="rawjson"><summary>原始 JSON 载荷（将提交给 Action）</summary><div id="bodyPreview"></div></details>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<footer class="submitbar">
  <span class="status" id="status">请选择上方一个动作开始。</span>
  <label class="switch"><input type="checkbox" id="directPush"> 直接推送到 main（跳过草稿 PR）</label>
  <button class="ghost" id="resetBtn">清空</button>
  <button class="primary" id="submitBtn" disabled>提交</button>
</footer>

<script>
(function(){
  "use strict";
  const REPO = "LelelelingStudio/lelele-game";
  const BRANCH = "main";
  const API = "https://api.github.com";
  const RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH;
  const PAT_KEY = "lelele_admin_pat_v1";

  const $ = (id) => document.getElementById(id);
  const state = { action:null, authors:[], maxId:30, fetched:false, mode:"form", payloadError:null };

  /* ---------- 工具 ---------- */
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
  function toast(msg, kind){ const t=$("toast"); t.textContent=msg; t.className="toast"+(kind?" "+kind:""); t.style.display="block"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",4200); }
  const LSFP_RE = /\.lsfp(?=[?#]|$)/i;
  const httpRe = /^(https:\/\/|mailto:|\/|#)/i;

  /* ---------- hostname 守卫 ---------- */
  (function guard(){
    const h = location.hostname;
    const local = h==='127.0.0.1'||h==='localhost'||h===''||location.protocol==='file:';
    if (!local){ $("hostWarn").style.display="block"; }
  })();

  /* ---------- PAT ---------- */
  const patInput = $("pat");
  patInput.value = localStorage.getItem(PAT_KEY) || "";
  patInput.addEventListener("input", ()=>{ localStorage.setItem(PAT_KEY, patInput.value.trim()); });

  async function ghFetch(path, opts){
    opts = opts || {};
    const headers = Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}, opts.headers||{});
    const pat = patInput.value.trim();
    if (pat) headers["Authorization"] = "Bearer " + pat;
    return fetch(API + path, Object.assign({headers}, opts));
  }
  async function rawJSON(path){
    const r = await fetch(RAW + path, {cache:"no-store"});
    if (!r.ok) throw new Error("拉取 "+path+" 失败 HTTP "+r.status);
    return r.json();
  }

  $("testBtn").addEventListener("click", async ()=>{
    if (!patInput.value.trim()){ $("connState").textContent="请先填写令牌"; return; }
    try{
      const r = await ghFetch("/repos/"+REPO);
      if (r.status===401){ $("connState").textContent="令牌无效（401）"; return; }
      if (r.status===403){ $("connState").textContent="令牌无权限或超限（403）"; return; }
      if (!r.ok){ $("connState").textContent="HTTP "+r.status; return; }
      const d = await r.json();
      $("connState").textContent="已连接："+ (d.full_name||REPO) + " · 默认分支 " + (d.default_branch||BRANCH);
    }catch(e){ $("connState").textContent="网络错误："+e.message; }
  });

  /* ---------- 数据拉取（raw，公开 CORS） ---------- */
  async function pullData(){
    $("pullBtn").textContent="拉取中…";
    try{
      const [games, authors] = await Promise.all([
        rawJSON("/lelegame_data.json"),
        rawJSON("/authors/index.json").catch(()=>([]))
      ]);
      state.maxId = Math.max(0, ...games.map(g=>g.id||0));
      state.authors = authors.map(a=>({id:a.id, zh:a.name_zh||"", en:a.name_en||"", official:!!a.official}));
      state.fetched = true;
      toast("已拉取最新数据：最大游戏 id = "+state.maxId+"，作者 "+state.authors.length+" 位","ok");
      if (state.action) renderForm(state.action); // 重渲染以预填 id 建议
    }catch(e){
      toast("拉取失败："+e.message,"err");
    }finally{
      $("pullBtn").textContent="拉取最新数据";
    }
  }
  $("pullBtn").addEventListener("click", pullData);

  /* ---------- 作者下拉 ---------- */
  function authorOptions(selected){
    const list = state.authors.length ? state.authors : [
      {id:1,zh:"了了了岭工作室",en:"Leleleling Studio",official:true},
      {id:2,zh:"Andy Huang",en:"Andy Huang"},{id:3,zh:"Kevin Liao",en:"Kevin Liao"},
      {id:4,zh:"Jonathan",en:"Jonathan"},{id:5,zh:"Wheat",en:"Wheat"},
      {id:6,zh:"Emolingo games",en:"Emolingo games"},{id:7,zh:"Zanie",en:"Zanie"},
      {id:8,zh:"Jeremy",en:"Jeremy"},{id:9,zh:"元成爱",en:"Roy Jin"}
    ];
    return list.map(a=>{
      const label = `id ${a.id} · ${a.zh||a.en}` + (a.official?" · 官方":"");
      return `<option value="${a.id}" ${String(a.id)===String(selected)?"selected":""}>${escapeHtml(label)}</option>`;
    }).join("");
  }

  /* ---------- 分类 / 适龄 / 类型 选题 ---------- */
  const CATEGORIES = [
    ["休闲","Casual"],["冒险","Adventure"],["射击","Shooter"],["动作","Action"],
    ["益智","Puzzle"],["模拟经营","Simulation"],["休闲 / 跑酷","Casual / Parkour"]
  ];
  const AGES = [["全年龄","All Ages"],["12+","12+"],["6+","6+"]];
  const TYPES = [["本地游戏","local"],["站外链接","external"],["站内页面","internal"]];
  const PRIORITIES = [["审批结果 (400)","400"],["全体重要 (300)","300"],["常规 (200)","200"],["低 (100)","100"]];

  function optGroup(arr, sel){
    return arr.map(([zh,en])=>`<option value="${escapeHtml(en)}" ${en===sel?"selected":""}>${escapeHtml(zh+" / "+en)}</option>`).join("");
  }

  /* ---------- 富文本工具条 ---------- */
  function wrapSelection(taId, before, after){
    const ta = $(taId); if(!ta) return;
    const s = ta.selectionStart, e = ta.selectionEnd;
    const v = ta.value, sel = v.slice(s,e) || "在此输入";
    ta.value = v.slice(0,s) + before + sel + after + v.slice(e);
    ta.focus(); ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length;
    refreshPreview();
  }
  function insertAtCursor(taId, html){
    const ta = $(taId); if(!ta) return;
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    ta.value = v.slice(0,s) + html + v.slice(e);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + html.length;
    refreshPreview();
  }
  function mediaToolbar(taId){
    return `<div class="toolbar">
      <button type="button" class="tbtn" data-act="strong">B 加粗</button>
      <button type="button" class="tbtn" data-act="video">🎬 视频链接</button>
      <button type="button" class="tbtn" data-act="img">🖼 图片链接</button>
    </div>`;
  }
  document.addEventListener("click",(e)=>{
    const b = e.target.closest(".tbtn"); if(!b) return;
    const act = b.dataset.act; const taId = b.closest(".rt").dataset.ta;
    if (act==="strong") wrapSelection(taId,"<strong>","</strong>");
    else if (act==="video"){ const u=prompt("视频直链（.mp4/.webm 等，支持 https）："); if(u) insertAtCursor(taId,`<video src="${escapeHtml(u)}" controls playsinline></video>`); }
    else if (act==="img"){ const u=prompt("图片链接（支持 .png/.jpg/.lsfp，.lsfp 会自动回退旧图）："); const alt=prompt("图片替代文字（alt，可空）：","")||""; if(u) insertAtCursor(taId,`<img src="${escapeHtml(u)}" alt="${escapeHtml(alt)}">`); }
  });

  /* ---------- 表单渲染 ---------- */
  function field(id,label,opts){
    opts=opts||{};
    const ph=opts.ph||"", type=opts.type||"text", val=opts.val!=null?opts.val:"";
    const hint=opts.hint?`<div class="hint">${escapeHtml(opts.hint)}</div>`:"";
    return `<div class="field"><label>${escapeHtml(label)}</label><input id="${id}" type="${type}" value="${escapeHtml(val)}" placeholder="${escapeHtml(ph)}">${hint}</div>`;
  }
  function duo(zhId,enId,zhLabel,enLabel,zhVal,enVal,ph){
    return `<div class="duo">
      <div class="field"><label>${escapeHtml(zhLabel)}</label><input id="${zhId}" value="${escapeHtml(zhVal||"")}" placeholder="${escapeHtml(ph||"")}"></div>
      <div class="field"><label>${escapeHtml(enLabel)}</label><input id="${enId}" value="${escapeHtml(enVal||"")}" placeholder="${escapeHtml(ph||"")}"></div>
    </div>`;
  }
  function select(id,label,optsHtml,val,hint){
    return `<div class="field"><label>${escapeHtml(label)}</label><select id="${id}">${optsHtml}</select>${hint?`<div class="hint">${escapeHtml(hint)}</div>`:""}</div>`;
  }
  function textarea(id,label,val,hint,rt){
    const tb = rt?`<div class="rt" data-ta="${id}">${mediaToolbar(id)}</div>`:"";
    return `<div class="field"><label>${escapeHtml(label)}</label>${tb}<textarea id="${id}">${escapeHtml(val||"")}</textarea>${hint?`<div class="hint">${escapeHtml(hint)}</div>`:""}</div>`;
  }

  function mediaBlock(){
    return `<div class="groupline">媒体链接（图片 / 视频 / 嵌入，支持 .lsfp）</div>
      <div id="mediaList"></div>
      <button type="button" class="addrow" data-add="media">+ 添加一条媒体</button>
      <div class="hint">图片 / 视频 src 支持 <code>.lsfp</code> 复合后缀（如 <code>pic.png.lsfp</code>），站点会自动解码并回退旧图。</div>`;
  }
  function btnBlock(){

    const a = state.action; state.payloadError = null;
    if (!a) return null;
    let data;
    if (state.mode==="json"){
      const raw = $("jsonEditor").value.trim();
      if (!raw){ state.payloadError="请在 JSON 框中粘贴 / 填写字段"; return null; }
      try { data = JSON.parse(raw); } catch(e){ state.payloadError="JSON 解析失败：" + e.message; return null; }
      if (typeof data!=="object" || data===null || Array.isArray(data)){ state.payloadError="JSON 顶层必须是对象（即字段集合）"; return null; }
    } else {
      if (a==="add-game") data = collectGame(false);
      else if (a==="update-game") data = collectGame(true);
      else if (a==="add-announcement") data = collectAnnouncement();
      else if (a==="add-notice") data = collectNotice();

    }

    if (a==="update-game") return {action:"update-game", data};
    if (a==="add-announcement") return {action:"add-announcement", data};
    if (a==="add-notice") return {action:"add-notice", data};
    return null;
  }

  /* ---------- JSON 模式工具 ---------- */
  function sanitizeHtml(raw){
    const ALLOWED_TAGS=['BR','A','DIV','P','SPAN','B','STRONG','I','EM','U','VIDEO','IMG'];
    const ALLOWED_ATTRS=['href','src','target','rel','controls','playsinline','muted','loop','poster','style','class','width','height','alt'];
    const outDoc=new DOMParser().parseFromString('<div></div>','text/html');
    const root=outDoc.body.firstElementChild;
    const inDoc=new DOMParser().parseFromString(String(raw||''),'text/html');
    const walk=(from,to)=>{ Array.from(from.childNodes).forEach(child=>{
      if(child.nodeType===3){ to.appendChild(outDoc.createTextNode(child.nodeValue)); return; }
      if(child.nodeType!==1) return;
      const tag=child.tagName.toUpperCase();
      if(!ALLOWED_TAGS.includes(tag)){ to.appendChild(outDoc.createTextNode(child.textContent||'')); return; }
      const el=outDoc.createElement(tag.toLowerCase());
      Array.from(child.attributes).forEach(attr=>{ const n=attr.name.toLowerCase(), v=attr.value||'';
        if(!ALLOWED_ATTRS.includes(n)) return;
        if((n==='href'||n==='src')&&!/^(https:\/\/|mailto:|\/|#)/i.test(v.trim())) return;
        if(n==='style'&&/(javascript\s*:|expression\s*\(|@import)/i.test(v)) return;
        el.setAttribute(n,v); });
      if(el.hasAttribute('target')) el.setAttribute('rel','noopener noreferrer');
      walk(child,el); to.appendChild(el); }); };
    walk(inDoc.body,root); return root.innerHTML;
  }
  function promoteLsfpImages(container){
    if(!container||!container.querySelectorAll) return;
    Array.from(container.querySelectorAll('img[src]')).forEach(img=>{
      const src=(img.getAttribute('src')||'').trim();
      if(!/\.lsfp(?=[?#]|$)/i.test(src)) return;
      img.setAttribute('data-lsfp-src',src);
      const fb=(window.LeleleLsfp&&window.LeleleLsfp.fallbackOf)?window.LeleleLsfp.fallbackOf(src):'';
      if(fb) img.setAttribute('data-lsfp-fallback',fb);
      img.removeAttribute('src');
    });
  }

      const bannerWrap=d.banner?'<div class="v-banner-wrap"><img class="v-banner" src="'+escapeHtml(d.banner)+'" alt=""></div>':'';
      const desc=(d.description_zh||"")+(d.description_en?("\n\n"+d.description_en):"");
      return '<div class="v-game">'+bannerWrap+'<div class="v-game-main"><div class="v-icon">'+escapeHtml(d.icon||"🎮")+'</div><div>'+
        '<div class="v-name">'+escapeHtml(d.name_zh||"（未填名称）")+(d.name_en?' <span class="v-name-en">'+escapeHtml(d.name_en)+'</span>':'')+'</div>'+
        '<div class="v-badges">'+(cat?'<span class="v-b">'+escapeHtml(cat)+'</span>':'')+(age?'<span class="v-b">'+escapeHtml(age)+'</span>':'')+(typeLabel?'<span class="v-b">'+escapeHtml(typeLabel)+'</span>':'')+(d.version?'<span class="v-b">'+escapeHtml(d.version)+'</span>':'')+'</div>'+
        ((d.summary||d.summary_en)?'<div class="v-sum">'+escapeHtml(d.summary||d.summary_en)+'</div>':'')+
        '</div></div>'+(desc?'<div class="v-desc">'+escapeHtml(desc)+'</div>':'')+(shots?'<div class="v-shots">'+shots+'</div>':'')+(d.url?'<a class="v-url" href="'+escapeHtml(d.url)+'" target="_blank" rel="noopener">打开游戏 ↗</a>':'')+'</div>';
    }
    if(p.action==="add-notice"){
      const media=(d.media||[]).map(m=>{
        if(m.type==="image") return '<img class="v-shot" src="'+escapeHtml(m.src)+'" alt="" loading="lazy">';
        if(m.type==="video") return '<video class="v-shot" src="'+escapeHtml(m.src)+'" controls playsinline></video>';
        return '<iframe class="v-shot" src="'+escapeHtml(m.src)+'"></iframe>';
      }).join("");
      const buttons=(d.buttons||[]).map(b=>'<a class="v-btn" href="'+escapeHtml(b.url||"#")+'" target="_blank" rel="noopener">'+escapeHtml(b.label_zh||b.label_en||"按钮")+'</a>').join("");
      const authorTxt=Array.isArray(d.author)?("发给 id: "+d.author.join(", ")):(d.author==="all"?"全体开发者":("开发者 id "+d.author));
      return '<div class="v-notice"><div class="v-ann-head"><span class="v-badge v-badge-notice">开发者告示</span><span class="v-date">'+escapeHtml(authorTxt)+'</span></div><h3 class="v-title">'+escapeHtml(d.title_zh||d.title_en||"（无标题）")+'</h3><div class="v-content" style="white-space:pre-wrap">'+escapeHtml((d.body_zh||"")+(d.body_en?("\n\n"+d.body_en):""))+'</div>'+(media?'<div class="v-shots">'+media+'</div>':'')+(buttons?'<div class="v-btns">'+buttons+'</div>':'')+'</div>';
    }
    return "";
  }
  function currentData(){
    const a=state.action;
    if(a==="add-game") return collectGame(false);
    if(a==="update-game"){ const b=collectGame(true); if(b.id==null||isNaN(Number(b.id))) b.id=Number(val("u-id"))||state.maxId; return b; }
    if(a==="add-announcement") return collectAnnouncement();
    if(a==="add-notice") return collectNotice();
    return {};
  }
  function setMode(mode){
    state.mode=mode;
    $("modeBar").querySelectorAll(".seg").forEach(s=>s.classList.toggle("active", s.dataset.mode===mode));
    const form = mode==="form";
    $("formBody").hidden=!form;
    const je=$("jsonEditor"); je.hidden=form;
    if(!form){ try{ je.value=JSON.stringify(currentData(),null,2); }catch(e){ je.value="{}"; } }
    refreshPreview();
  }

  /* ---------- 预览 ---------- */
  function refreshPreview(){
    const p = buildPayload();
    const fl = $("fileList"), vp = $("visualPreview"), bp = $("bodyPreview");
    if (state.payloadError){ fl.innerHTML=""; vp.innerHTML=`<div class="v-err">⚠ ${escapeHtml(state.payloadError)}</div>`; bp.innerHTML=""; updateSubmit(); return; }
    if (!p){ fl.innerHTML=""; vp.innerHTML=""; bp.innerHTML=""; updateSubmit(); return; }
    let files=[];
    if (p.action==="add-game") files=[`lelegame_data.json <b>追加 1 条</b>`, `game/data/${p.data.id}.json <b>新建</b>`];
    else if (p.action==="update-game") files=[`lelegame_data.json <b>更新 id ${p.data.id}</b>`, `game/data/${p.data.id}.json <b>更新</b>`];
    else if (p.action==="add-announcement") files=[`announcements.json <b>追加 1 条</b>`];
    else if (p.action==="add-notice") files=[`noticetodeveloper.json <b>追加 1 条（version 自动 +1）</b>`];
    fl.innerHTML = files.map(f=>`<li>${f}</li>`).join("");
    bp.innerHTML = `<pre>${escapeHtml(JSON.stringify(p.data,null,2))}</pre>`;
    const html = renderVisual(p);
    vp.innerHTML = html || "";
    if (html){
      promoteLsfpImages(vp);
      if (window.LeleleLsfp) setTimeout(()=>window.LeleleLsfp.hydrate(vp), 60);
    }
    updateSubmit();
  }

  let submitting = false;
  function updateSubmit(){
    if (submitting) return;
    const p = buildPayload();
    const btn = $("submitBtn");
    const enabled = p && ["add-game","update-game","add-announcement","add-notice"].includes(p.action) && patInput.value.trim();
    btn.disabled = !enabled;
    if (state.payloadError) $("status").textContent = state.payloadError;
    else if (!p) $("status").textContent = "请完整填写表单。";
    else $("status").textContent = "已就绪，点击提交将触发 GitHub Action 校验并落地。";
  }
  document.addEventListener("input", refreshPreview);
  document.addEventListener("change", refreshPreview);

  /* ---------- 提交 ---------- */
  $("submitBtn").addEventListener("click", async ()=>{
    const p = buildPayload(); if(!p) return;
    p.direct_push = $("directPush").checked;
    const pat = patInput.value.trim();
    if(!pat){ toast("请先填写 GitHub 令牌","err"); return; }
    submitting=true;
    $("submitBtn").disabled=true; $("status").textContent="已提交，等待 Action…";
    try{
      const r = await fetch(API+"/repos/"+REPO+"/dispatches",{
        method:"POST",
        headers:{"Authorization":"Bearer "+pat,"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
        body: JSON.stringify({event_type:"admin-apply", client_payload:p})
      });
      if (r.status===204){
        toast("已触发 Action ✔ 默认开草稿 PR（或已直接推送）","ok");
        $("status").innerHTML='已触发。查看 <a href="https://github.com/'+REPO+'/actions" target="_blank">Actions 运行</a> · <a href="https://github.com/'+REPO+'/pulls" target="_blank">Pull Requests</a>';
      } else if (r.status===404){ toast("仓库不存在或无权限（404）","err"); $("status").textContent="404：检查令牌权限（需 Contents 写）"; }
      else if (r.status===403){ toast("权限不足或触发频率限制（403）","err"); $("status").textContent="403：令牌需 Contents:write，或触发频率限制"; }
      else { const t=await r.text().catch(()=> ""); toast("提交失败 HTTP "+r.status,"err"); $("status").textContent="HTTP "+r.status+": "+t.slice(0,120); }
    }catch(e){ toast("网络错误："+e.message,"err"); $("status").textContent="网络错误："+e.message; }
    finally{ submitting=false; $("submitBtn").disabled=false; }
  });

  $("resetBtn").addEventListener("click", ()=>{ renderForm(state.action); });

  /* ---------- 动作卡 ---------- */
  const ACTIONS = [
    {id:"add-game", ico:"➕", t:"新增游戏", d:"收录一款新游戏（主列表 + 详情）"},
    {id:"update-game", ico:"✏️", t:"更新游戏", d:"改现有游戏字段，URL 两处同步"},
    {id:"add-announcement", ico:"📢", t:"发全站公告", d:"富文本：加粗/视频/图片/.lsfp"},
    {id:"add-notice", ico:"🔔", t:"发开发者告示", d:"定向弹窗 + 媒体 + 按钮"},
    {id:"add-author", ico:"👤", t:"添加作者", d:"暂未开放（权威源在站外 Surge）", disabled:true},
    {id:"edit-author", ico:"🛠", t:"修改作者信息", d:"暂未开放（权威源在站外 Surge）", disabled:true}
  ];
  function renderCards(){
    $("cards").innerHTML = ACTIONS.map(a=>`
      <div class="card ${a.disabled?"disabled":""} ${state.action===a.id?"active":""}" data-action="${a.id}">
        <div class="ico">${a.ico}</div><div class="t">${escapeHtml(a.t)}</div><div class="d">${escapeHtml(a.d)}</div>
        ${a.disabled?'<span class="cta">🔒 暂未开放</span>':'<span class="cta">选择 →</span>'}
      </div>`).join("");
  }
  $("cards").addEventListener("click",(e)=>{
    const c=e.target.closest(".card"); if(!c||c.classList.contains("disabled")) return;
    renderCards();
    renderForm(c.dataset.action);
  });
  $("modeBar").addEventListener("click",(e)=>{ const s=e.target.closest(".seg"); if(!s) return; setMode(s.dataset.mode); });

  /* ---------- 初始化 ---------- */
  renderCards();
  if (patInput.value.trim()){ /* 已有令牌，提示可测试 */ $("connState").textContent="已记住令牌（建议点测试连接校验）"; }
  pullData();
})();
</script>
</body>
</html>
