name: Apply admin changes

on:
  repository_dispatch:
    types: [admin-apply]

permissions:
  contents: write
  pull-requests: write

# 2026-11-14 起作者权威源迁回本仓库、sync-authors.yml 已退役，本工作流是唯一的自动写入入口。
# 默认走草稿 PR，仅在站长勾选「直接推送」时才直推 main；并发组保证多次提交串行，不互相覆盖。
concurrency:
  group: admin-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 生成前先快进拉取，确保基于最新 main 校验（尤其作者 id 唯一性）
      - name: Fast-forward to latest
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true

      - name: Validate & generate
        id: apply
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node .github/scripts/admin-apply.mjs

      - name: Commit and open draft PR (or push directly)
        env:
          DIRECT: ${{ github.event.client_payload.direct_push }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "无改动，跳过提交"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ "$DIRECT" = "true" ]; then
            git add -A
            git commit -m "chore(admin): apply changes via admin console"
            # 直推前再 rebase 一次，降低与站长其它手动推送的并发冲突
            git pull --rebase origin "${GITHUB_REF_NAME}" || echo "::warning::rebase 失败，仍尝试直接推送"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            BR="admin-apply-$(date +%s)"
            git checkout -b "$BR"
            git add -A
            git commit -m "chore(admin): apply changes via admin console"
            git push origin "$BR"
            if ! gh pr create --draft --base "${GITHUB_REF_NAME}" \
                 --title "Admin 控制台改动（草稿，待复核）" \
                 --body "由 admin 控制台自动生成，经校验后写入，待人工复核合并。"; then
              echo "::error::创建草稿 PR 失败。最常见原因：仓库 Settings → Actions → General → Workflow permissions 未勾选「Allow GitHub Actions to create and approve pull requests」。勾选后重试；或打开 admin 页面的「直接推送 main」开关。"
              exit 1
            fi
          fi
